<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Intern Training | SoftSync Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="https://softsyncsolutions.in/favicon-32x32.png">
    <style>
        :root {
            --text: #0f172a;
            --text-dim: #475569;
            --gradient: linear-gradient(135deg, #0d9488 0%, #4f46e5 52%, #f59e0b 120%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: var(--text);
        }
        .card {
            text-align: center;
            padding: 60px 48px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            max-width: 520px;
            margin: 24px;
        }
        .brand { font-size: 22px; font-weight: 700; }
        .tagline {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-top: 4px;
        }
        h1 { font-size: 24px; margin-top: 28px; }
        p { color: var(--text-dim); margin-top: 10px; line-height: 1.6; font-size: 14px; }
        .bar { height: 4px; width: 64px; margin: 18px auto 0; border-radius: 2px; background: var(--gradient); }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">SoftSync Lab</div>
        <div class="tagline">Automate &middot; Integrate &middot; Scale</div>
        <h1>Intern Training</h1>
        <p>Training modules, assessments and weekly reports for SoftSync Lab interns.</p>
        <div class="bar"></div>
    </div>
</body>
</html>
